    - name: ANN-Based MPC For an Experimental Dissolved Air Flotation Process
      tags: "Undergraduate Research - FAPESP"
      date: 2023 - 2024
      description: |
        Designed and implemented a Model Predictive Control (MPC) system leveraging Artificial Neural Networks (ANNs) to optimize the control of a dissolved air flotation pilot plant.
        + Developed and trained neural network models using Python and relevant libraries to accurately predict the process dynamics from sensor data.
        + Engineered the complete software and hardware integration, enabling real-time data acquisition and automated control loop execution.
        + Co-authored and published the research findings in an international conference paper, contributing to the field of intelligent process control. [Link to paper](https://doi.org/10.1016/B978-0-443-28824-1.50012-0)


