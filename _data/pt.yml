profile:
  show: true
  order: 1
  title: Sobre
  description: |
    Engenheiro químico especializado na aplicação de IA para solucionar desafios industriais complexos. Experiência no desenvolvimento e implementação de soluções para controle de processos, detecção de anomalias e Detecção e Diagnóstico de Falhas (FDD). Atualmente, cursa mestrado com foco em pesquisa sobre o uso de Modelos de Linguagem (LLMs) para aprimorar a análise de segurança de processos (HAZOP).
experience:
  show: true
  order: 2
  title: Experiência
  items:
    - company: iSystems
      link: "https://isystems.ai/"
      tags: IA, LLMs, Remoto
      date: 2024.08 - Presente
      role: Pesquisador Bolsista em IA
      location: Brasil
      description: |
        + Arquitetou e desenvolveu sistemas baseados em LLM usando Python e LangGraph para: análise de dados em bancos de dados de clientes, análise de desempenho de malhas de controle e otimização de estoque e previsão de demanda.
        + Implantação de agentes em ambientes de produção, com práticas de melhoria contínua por meio de feedback de usuários (DPO) e especialistas internos (SFT).
    - company: UNICAMP
      tags: Ensino, Pesquisa
      date: 2022.03 - 2023.12
      role: Auxiliar Docente (PAD - Programa de Apoio Didático)
      location: Brasil
      description: |
        + Orientou alunos de graduação nas disciplinas de Cálculo Numérico (MS211), Instrumentação na Indústria Química (EQ771) e Controle de Processos (EQ817).
        + Conduziu sessões de resolução de problemas técnicos e atribuições de nota, esclarecendo conceitos complexos em controle de processos e métodos numéricos.
        + Auxiliou o corpo docente na preparação de materiais educacionais e no gerenciamento de cursos para turmas com mais de 50 alunos.


project:
  show: true
  order: 3
  title: Projetos
  items:
    - name: MPC baseado em Modelo Neural para um processo experimental de FAD
      tags: "Iniciação Científica - FAPESP"
      date: 2023 - 2024
      description: |
        Projetou e implementou um sistema de Controle Preditivo de Modelo (MPC) usando Redes Neurais Artificias para otimizar o controle de uma planta piloto de flotação por ar dissolvido (FAD).
        + Desenvolveu e treinou modelos de redes neurais usando Python e bibliotecas relevantes para prever com precisão a dinâmica do processo a partir de dados de sensores.
        + Projetou a integração completa de software e hardware, permitindo aquisição de dados em tempo real e execução automatizada do loop de controle.
        + Foi coautor e publicou os resultados da pesquisa em um artigo de conferência internacional, contribuindo para a área de controle inteligente de processos. [Link para o artigo](https://doi.org/10.1016/B978-0-443-28824-1.50012-0)


